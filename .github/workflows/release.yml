name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CoreFlow Main Binary
        run: cargo build --release --bin CoreFlow

      - name: Build CoreFlow Setup Installer
        run: cargo build --release --bin CoreFlow_Setup

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            target/release/CoreFlow.exe
            target/release/CoreFlow_Setup.exe

  build-macos:
    name: Build macOS Universal App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Apple Silicon (Native)
        run: |
          if ! cargo build --release --bin CoreFlow 2> build_err.txt; then
            cat build_err.txt
            tail -n 30 build_err.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build Intel Mac (x86_64)
        run: |
          if ! cargo build --release --target x86_64-apple-darwin --bin CoreFlow 2> build_err_x86.txt; then
            cat build_err_x86.txt
            tail -n 30 build_err_x86.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Assemble Universal Binary & macOS App Bundle
        run: |
          mkdir -p CoreFlow.app/Contents/MacOS
          mkdir -p CoreFlow.app/Contents/Resources
          lipo -create \
            target/release/CoreFlow \
            target/x86_64-apple-darwin/release/CoreFlow \
            -output CoreFlow.app/Contents/MacOS/CoreFlow
          chmod +x CoreFlow.app/Contents/MacOS/CoreFlow

          VERSION_TAG=${GITHUB_REF_NAME#v}
          cat << EOF > CoreFlow.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CoreFlow</string>
              <key>CFBundleIdentifier</key>
              <string>com.coreflow.app</string>
              <key>CFBundleName</key>
              <string>CoreFlow</string>
              <key>CFBundleDisplayName</key>
              <string>CoreFlow</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION_TAG}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION_TAG}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          zip -r CoreFlow-macOS-universal.zip CoreFlow.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: CoreFlow-macOS-universal.zip

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-binaries
          path: release-assets

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum CoreFlow.exe CoreFlow_Setup.exe CoreFlow-macOS-universal.zip > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/CoreFlow.exe
            release-assets/CoreFlow_Setup.exe
            release-assets/CoreFlow-macOS-universal.zip
            release-assets/SHA256SUMS.txt
          tag_name: ${{ github.ref_name }}
          name: CoreFlow ${{ github.ref_name }} — Graphite 정밀 계측 UI 리디자인, 미니 HUD·디스크 가독성 개선 및 동영상 플레이어 오탐 차단
          body: |
            ## 🚀 CoreFlow ${{ github.ref_name }} 릴리스 노트

            CoreFlow ${{ github.ref_name }}는 **무광 흑연(Graphite) 계측기 UI 전면 리디자인**, **미니 HUD 및 게임 플레이 기록 가독성·레이아웃 개선**, 그리고 **동영상 플레이어 게임 오탐 차단**을 포함한 업데이트입니다.

            ---

            ### 🎨 v1.0.13 UI 전면 정돈 (Graphite 계측기 디자인)
            - **중립 Graphite 다크/라이트 램프 & 4px 그리드 통일**: 과한 원색 남발·그라데이션 진행 바·컬러 글로우·카드 호버 점프를 제거하고, 순수 무채색 표면 단계와 8% 헤어라인 위에 시계열 차트와 핵심 수치(`tabular-nums`)가 선명하게 읽히도록 정돈했습니다.
            - **단일 라인 SVG 아이콘 & 간결한 카피**: UI 전반의 이모지, Discord식 하이픈 메뉴명, 불필요한 느낌표를 제거하고 `16px / stroke 1.5` 라인 아이콘과 `<kbd>` 단축키 키캡으로 통일했습니다.

            ---

            ### 🛠️ v1.0.13 세부 사용성 및 게임 감지 개선
            - **미니 HUD `NET / PING` 칸 크기 확장**: 박스형(3×2) 기본 창 크기를 `540×312`, 가로바형 높이를 `196px`로 여유 있게 키워 핑·다운로드/업로드·디스크 I/O 수치가 짤리지 않도록 개선했습니다.
            - **대시보드 드라이브 용량 색상 차별화**: 드라이브 문자(`C:`, `D:`), 점유율(녹색/노랑/빨강), 여유 용량(`GB 여유`)을 칩 형태로 구분해 한눈에 파악되도록 개선했습니다.
            - **게임 미실행 시 FPS 카드 & 플레이 기록 카드 짤림 수정**: 미실행 시 `실행 중인 게임...` 대신 `게임 없음`으로 명확히 표시하고, 게임 플레이 기록 상단 카드 타이틀과 2줄 누적 통계가 짤리지 않도록 수정했습니다.
            - **동영상 플레이어 게임 오탐 차단**: PotPlayer, VLC, MPC-HC/BE, MPV, 곰플레이어, KMPlayer, Windows 미디어 플레이어 및 영상 파일 확장자(`.mp4`, `.mkv`, `.avi` 등)를 게임 감지 블랙리스트에 추가해 동영상 시청이 게임으로 기록되지 않도록 수정했습니다.
            - **좌측 하단 프로필 패널 정리**: 좁은 영역에서 짤리던 중복 하드웨어 점유율 텍스트를 제거하고 깔끔한 상태 표시로 정리했습니다.

            ---

            ### ⚡ v1.0.12 장기 실행 안정성 & 멈춤 방지 아키텍처 개선 (이전 버전 포함 내용)
            - **전용 백그라운드 수집 스레드 분리 (`SharedMeta` + `StatsCollector`)**: 기존에는 HTTP 요청(`/api/stats`)이 뮤텍스 잠금을 잡은 채로 시스템 정보 수집·포그라운드 창 조회·파일 저장까지 동기 처리하여, OS 호출 지연 시 앱 전체가 멈추고 재시작되는 문제가 있었습니다. 이제 전용 수집 스레드가 백그라운드에서 스냅샷 JSON을 생성하고, HTTP/UI는 캐시된 스냅샷을 잠금 대기 없이 즉시 반환합니다.
            - **초경량 프로세스 스캔 & `rayon` 스레드 풀 제거**: 매초 전체 프로세스의 PEB 메모리(`cmd`/`cwd`/`environ`)와 토큰을 원격으로 읽던 무거운 기본 스캔을 제거하고, CPU·메모리·디스크 I/O·최초 실행 경로(`OnlyIfNotSet`)만 조회하도록 경량화했습니다. `sysinfo`의 `multithread`(`rayon`) 피처도 비활성화하여 안티치트·보안 프로그램·종료 중인 프로세스와의 커널 교착을 원천 차단했습니다.
            - **CPU 온도 감시 PowerShell/WMI 폭주 제거**: 물리 WMI 센서가 없는 일반 데스크톱에서 5초마다 `powershell.exe`를 반복 생성하던 로직을 개선하여, 미감지 시 5분(300초) 주기로 자동 백오프하도록 변경했습니다.
            - **장기 실행 리소스 보호 강화**: CPU 브랜드·OS 이름 1회 캐시, `nvidia-smi` 자식 프로세스 `wait()` 정리, 경로·아이콘 캐시 크기 상한, HTTP 동시 요청 워커 상한(64), 워치독 멈춤 단계(`stage`) 진단 로그를 추가했습니다.

            ---

            ### 🎨 v1.0.11 UI/UX 및 반응형 개선 (이전 버전 포함 내용)
            - **상단 바 정리 (`🧰 도구 · 메뉴 ▾` 토글 박스)**: 우측 색상코드 배지를 제거하고 녹화·분석·알림·설정·미니 HUD·도움말·업데이트·테마 선택을 깔끔한 드롭다운 토글 박스로 통합하여 좌측 메뉴명이 항상 선명하게 보이도록 개선했습니다.
            - **전 메뉴 창 크기 자동 조절**: 창 크기를 줄이거나 키울 때 사이드바, 대시보드 4열/2열 카드, 설정·알림 모달 및 토글 메뉴가 화면 너비에 맞춰 자동으로 재배치됩니다.

            ---

            ### 🛠️ 공용 사용자 환경 안정성 및 설치/제거 개선
            - **OneDrive·한글·사용자 지정 바탕화면 바로가기 수정**: Windows 공식 Shell API(`SHGetKnownFolderPath(FOLDERID_Desktop)`)와 아이콘 캐시 즉시 갱신(`SHChangeNotify`)을 적용해 OneDrive 백업이 켜진 PC에서도 실제 바탕화면에 바로가기 아이콘이 정확히 생성됩니다.
            - **멀티 모니터 분리 시 화면 이탈 자동 복구**: 서브 모니터에서 사용하다 모니터를 분리한 뒤 실행해도 가상 화면 범위를 검사해 주 모니터 안으로 자동 복귀합니다.
            - **일반(비관리자) 계정 권한 최적화**: 설정 저장 시 `%LOCALAPPDATA%\CoreFlow`에만 기록하도록 정리해 `Program Files` 불필요 쓰기 시도를 제거했습니다.
            - **브라우저 지원 확대**: Edge 외에도 사용자별 설치 Chrome, 네이버 웨일(`whale.exe`), Brave 브라우저를 자동 감지하며 작업 폴더를 `%TEMP%`로 분리합니다.
            - **완전 제거 시 데이터 100% 정리**: 모든 데이터 삭제 선택 시 `%LOCALAPPDATA%\CoreFlow`, 임시 웹뷰 프로필, 잔여 바로가기까지 남김없이 정리합니다.

            ---

            ### 🧭 v1.0.10 미니 HUD 8방향 표시 위치 프리셋 & 범용 게임 핑 알고리즘 (이전 버전 포함 내용)
            - **3×3 시각적 위치 선택기**: 미니 HUD 설정(`⚙️ 설정`)에서 `↖ 좌상단`, `↑ 상단 중앙`, `↗ 우상단`, `← 좌측 중앙`, `📌 마지막 위치`, `→ 우측 중앙`, `↙ 좌하단`, `↓ 하단 중앙`, `↘ 우하단` 중 원하는 위치를 원클릭으로 지정할 수 있습니다.
            - **멀티 모니터 & 작업 표시줄 자동 대응**: 현재 창이 위치한 모니터의 유효 영역(`availLeft`/`availTop`/`availWidth`/`availHeight`)을 계산해 작업 표시줄에 가리지 않도록 자동 정렬합니다.
            - **레이아웃 전환 시 자동 재정렬**: `박스형 ↔ 가로바형` 전환이나 표시 타일 개수를 변경할 때도 선택한 모서리·중앙 위치에 맞춰 자동으로 위치를 재조정합니다.

            ---

            ### 🌐 범용 다중 IP 계층 핑 측정 알고리즘 고도화
            - **해외 채팅/보조 서버 오탐 원천 차단**: 소울프레임·워프레임(IRC `6697`), 롤(XMPP `5223`), 음성 STUN/TURN(`3478`/`3479`/`19302`) 등 해외 채팅·보조 서버가 국내/아시아 게임 서버 핑을 가리던 문제를 해결했습니다.
            - **게임별 수동 분석 불필요**: 포트만으로 연결을 미리 버리지 않고, 게임 프로세스가 연결한 모든 고유 원격 IP의 RTT를 측정한 뒤 **지역 티어 + 포트 가중치**로 최적의 실제 게임 서버를 자동 선택합니다.

            ---

            ### 🗑️ v1.0.9 언인스톨러 동기화 및 완전 제거 개선 (이전 버전 포함 내용)
            - **언인스톨러 버전 & Windows '설치된 앱' 레지스트리 자동 동기화**: 구버전(v1.0.0~v1.0.5)에서 업데이트한 환경에서도 `Uninstall_CoreFlow.exe` 파일과 Windows 설정의 `DisplayVersion`이 현재 실행 중인 최신 버전과 자동으로 일치하도록 개선했습니다.
            - **제거 시 설치 폴더(`C:\Program Files\CoreFlow`) 100% 완전 삭제**: 모든 데이터 삭제 선택 시 `%TEMP%` 호스트 이관 및 실행 파일 대피 이동, 하위 `nvidia-smi` 상주 프로세스 정리를 통해 잠금 없이 `Uninstall_CoreFlow.exe`, `.old` 백업 파일, 그리고 `C:\Program Files\CoreFlow` 폴더 전체가 깨끗하게 삭제됩니다.
            - **제거 완료 후 창 자동 종료**: 제거가 완료되면 안내 표시 후 언인스톨러 창과 프로세스가 자동으로 닫힙니다.

            ---

            ### 🛡️ v1.0.8 Windows 보안 및 백신 오탐 방지 개선 (이전 버전 포함 내용)
            - **PE 버전 리소스(`VS_VERSIONINFO`) 및 매니페스트(`RT_MANIFEST`) 내장**: `CoreFlow.exe`와 `CoreFlow_Setup.exe`에 제품명·파일 설명·버전·저작권·원본 파일명 메타데이터와 Windows 10/11 호환성 매니페스트(`asInvoker`)를 정식 내장하여 출처 불명 실행 파일로 분류되는 정적 오탐 요인을 해소했습니다.
            - **업데이트 파일 SHA-256 해시 및 PE64 헤더 무결성 검증**: 자동 업데이트 다운로드 직후 실행 전에 유효한 64비트 Windows PE 헤더(`MZ` / `PE\0\0` / `AMD64`)인지 확인하고, GitHub Releases API의 공식 `sha256` 다이제스트와 해시가 일치하는지 검증합니다.
            - **표준 Win32 API 전환 (의심 셸 호출 제거)**: 백신의 행위 기반 탐지를 유발할 수 있던 숨김 `powershell.exe`, `cmd.exe /C start`, `net.exe localgroup`, `taskkill.exe` 호출을 모두 제거하고 표준 Win32 API(`ShellExecuteW` 등) 직접 호출로 대체했습니다.

            ---

            ### 🛠️ v1.0.7 업데이트 롤백 문제 해결 (이전 버전 포함 내용)
            - **원인**: v1.0.5 이하의 업데이터가 설치 관리자(`CoreFlow_Setup.exe`) 대신 포터블 `CoreFlow.exe`를 내려받아 임시 폴더(`%TEMP%`)에서 실행했기 때문에, 새 버전은 임시 폴더에서만 실행되고 설치 폴더에는 구버전이 남아 재부팅 시 구버전이 실행되었습니다.
            - **설치 경로 자가 복구**: 구버전 업데이터로 실행된 경우에도 새 버전이 스스로 설치 폴더(`C:\Program Files\CoreFlow`)의 실행 파일을 교체한 뒤 설치된 경로에서 재실행합니다. (필요 시 관리자 권한 확인 창이 표시될 수 있습니다)
            - **시작 프로그램 항목 통합**: 설치 관리자(`CoreFlowMonitor`)와 앱(`CoreFlow`)이 따로 등록하던 시작 프로그램 항목을 하나로 통합하고, 실행 시 항상 현재 설치본 경로로 자동 동기화합니다.
            - **업데이트 시 자동 실행 설정 유지**: 자동 업데이트 과정에서 '윈도우 시작 시 자동 실행' 설정이 해제되던 문제를 수정했습니다.

            > 💡 v1.0.5 이하 사용자도 앱 내 업데이트 버튼으로 v1.0.7을 설치하면 자동으로 복구됩니다.

            ---

            ## 📋 v1.0.6 주요 변경 사항 (이전 릴리스 포함 내용)

            ---

            ### 👻 미니 HUD 실시간 투명도 조절 & 화면 투과 개선
            - **상단 바 인라인 슬라이더(막대바) 탑재**: 버튼 순환 방식 대신 마우스로 부드럽게 드래그하여 투명도를 30%~100%까지 즉시 조절할 수 있습니다.
            - **대시보드 잔상/비침 원천 차단**: 미니 HUD 모드 진입 시 일반 대시보드 요소를 완벽 은닉하여, 투명화 시 순수 바탕화면 및 게임 화면만 깨끗하게 투과되도록 개선했습니다.

            ---

            ### 🌡️ CPU / GPU 모니터링 및 UI 시각화 강화
            - **점유율 / 온도 일체형 표기**: CPU 및 GPU 카드에 `점유율 / 온도` (예: `20.5% / 45°C`)를 직관적으로 통합 표시합니다.
            - **GPU VRAM 헤더 재배치**: VRAM 점유 정보가 말줄임표(...)로 잘리는 현상을 해결하기 위해 카드 상단 헤더 영역으로 최적 배치했습니다.
            - **AMD Ryzen CPU 온도 지원**: AMD 프로세서 및 메인보드 센서 미지원 환경에서도 정밀한 동적 열역학 기반 실시간 온도 추정/측정 엔진을 제공합니다.
            - **AMD Radeon & Intel Arc 그래픽 카드 지원**: NVIDIA 외에도 AMD Radeon, Intel Arc GPU 감지 및 범용 하드웨어 ETW FPS 엔진 호환성을 강화했습니다.
            - **공통 가이드 UI 개선**: 각 카드마다 반복되던 텍스트를 카드 섹션 상단 공통 툴바 안내문으로 정리하여 깔끔한 화면을 제공합니다.

            ---

            ### 🍎 macOS 센서 및 원클릭 인앱 업데이트
            - **macOS 하드웨어 센서 폴백 완비**: Apple Silicon 및 Intel Mac 환경에서 IOKit/sysctl 기반 모니터링 파이프라인을 지원합니다.
            - **원클릭 인앱 무인 자동 업데이트**: 백그라운드 다운로드부터 `/Applications/CoreFlow.app` 교체, Gatekeeper 격리 해제 및 재시작까지 원클릭으로 지원합니다.

            ---

            ### 🛠️ 자동 업데이트 및 시스템 안정성 버그 수정
            - **윈도우 시작 프로그램 경로 고정**: 자동 업데이트 시 설치 경로(`C:\Program Files\CoreFlow\CoreFlow.exe`)로 정확히 업데이트되어 재부팅 시 구버전으로 되돌아가던 문제를 해결했습니다.
            - **재시작 충돌 방지**: 업데이트 후 재시작 과정에서 기존 프로세스가 정상 종료되지 않아 발생하던 흰색 화면 멈춤 현상을 원천 차단했습니다.

            ---

            ### 📦 다운로드 안내
            - **Windows**: `CoreFlow_Setup.exe` (간편 설치 관리자) 또는 `CoreFlow.exe` (포터블 실행 파일)
            - **macOS**: `CoreFlow-macOS-universal.zip` 다운로드 후 압축 해제 ➔ `CoreFlow.app`을 `/Applications` 폴더로 이동하여 실행 (이후 업데이트는 앱 내에서 원클릭으로 자동 진행됩니다)
