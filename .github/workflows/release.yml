name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CoreFlow Main Binary
        run: cargo build --release --bin CoreFlow

      - name: Build CoreFlow Setup Installer
        run: cargo build --release --bin CoreFlow_Setup

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            target/release/CoreFlow.exe
            target/release/CoreFlow_Setup.exe

  build-macos:
    name: Build macOS Universal App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Apple Silicon (Native)
        run: |
          if ! cargo build --release --bin CoreFlow 2> build_err.txt; then
            cat build_err.txt
            tail -n 30 build_err.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build Intel Mac (x86_64)
        run: |
          if ! cargo build --release --target x86_64-apple-darwin --bin CoreFlow 2> build_err_x86.txt; then
            cat build_err_x86.txt
            tail -n 30 build_err_x86.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Assemble Universal Binary & macOS App Bundle
        run: |
          mkdir -p CoreFlow.app/Contents/MacOS
          mkdir -p CoreFlow.app/Contents/Resources
          lipo -create \
            target/release/CoreFlow \
            target/x86_64-apple-darwin/release/CoreFlow \
            -output CoreFlow.app/Contents/MacOS/CoreFlow
          chmod +x CoreFlow.app/Contents/MacOS/CoreFlow

          VERSION_TAG=${GITHUB_REF_NAME#v}
          cat << EOF > CoreFlow.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CoreFlow</string>
              <key>CFBundleIdentifier</key>
              <string>com.coreflow.app</string>
              <key>CFBundleName</key>
              <string>CoreFlow</string>
              <key>CFBundleDisplayName</key>
              <string>CoreFlow</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION_TAG}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION_TAG}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          zip -r CoreFlow-macOS-universal.zip CoreFlow.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: CoreFlow-macOS-universal.zip

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/CoreFlow.exe
            release-assets/CoreFlow_Setup.exe
            release-assets/CoreFlow-macOS-universal.zip
          tag_name: ${{ github.ref_name }}
          name: CoreFlow ${{ github.ref_name }} — 미니 HUD 투명도 슬라이더, CPU/GPU 온도 통합 모니터링 및 하드웨어 호환성 강화
          body: |
            ## 🚀 CoreFlow ${{ github.ref_name }} 릴리스 노트

            CoreFlow ${{ github.ref_name }}는 **미니 HUD 실시간 투명도 슬라이더 바**, **CPU/GPU 점유율 및 온도 통합 모니터링 표기**, **AMD Ryzen / Radeon 및 Intel Arc 호환성 강화**, 그리고 **자동 업데이트 프로세스 안정성 개선**을 포함한 주요 기능 업데이트 버전입니다.

            ---

            ### 👻 미니 HUD 실시간 투명도 조절 & 화면 투과 개선
            - **상단 바 인라인 슬라이더(막대바) 탑재**: 버튼 순환 방식 대신 마우스로 부드럽게 드래그하여 투명도를 30%~100%까지 즉시 조절할 수 있습니다.
            - **대시보드 잔상/비침 원천 차단**: 미니 HUD 모드 진입 시 일반 대시보드 요소를 완벽 은닉하여, 투명화 시 순수 바탕화면 및 게임 화면만 깨끗하게 투과되도록 개선했습니다.

            ---

            ### 🌡️ CPU / GPU 모니터링 및 UI 시각화 강화
            - **점유율 / 온도 일체형 표기**: CPU 및 GPU 카드에 `점유율 / 온도` (예: `20.5% / 45°C`)를 직관적으로 통합 표시합니다.
            - **GPU VRAM 헤더 재배치**: VRAM 점유 정보가 말줄임표(...)로 잘리는 현상을 해결하기 위해 카드 상단 헤더 영역으로 최적 배치했습니다.
            - **AMD Ryzen CPU 온도 지원**: AMD 프로세서 및 메인보드 센서 미지원 환경에서도 정밀한 동적 열역학 기반 실시간 온도 추정/측정 엔진을 제공합니다.
            - **AMD Radeon & Intel Arc 그래픽 카드 지원**: NVIDIA 외에도 AMD Radeon, Intel Arc GPU 감지 및 범용 하드웨어 ETW FPS 엔진 호환성을 강화했습니다.
            - **공통 가이드 UI 개선**: 각 카드마다 반복되던 텍스트를 카드 섹션 상단 공통 툴바 안내문으로 정리하여 깔끔한 화면을 제공합니다.

            ---

            ### 🍎 macOS 센서 및 원클릭 인앱 업데이트
            - **macOS 하드웨어 센서 폴백 완비**: Apple Silicon 및 Intel Mac 환경에서 IOKit/sysctl 기반 모니터링 파이프라인을 지원합니다.
            - **원클릭 인앱 무인 자동 업데이트**: 백그라운드 다운로드부터 `/Applications/CoreFlow.app` 교체, Gatekeeper 격리 해제 및 재시작까지 원클릭으로 지원합니다.

            ---

            ### 🛠️ 자동 업데이트 및 시스템 안정성 버그 수정
            - **윈도우 시작 프로그램 경로 고정**: 자동 업데이트 시 설치 경로(`C:\Program Files\CoreFlow\CoreFlow.exe`)로 정확히 업데이트되어 재부팅 시 구버전으로 되돌아가던 문제를 해결했습니다.
            - **재시작 충돌 방지**: 업데이트 후 재시작 과정에서 기존 프로세스가 정상 종료되지 않아 발생하던 흰색 화면 멈춤 현상을 원천 차단했습니다.

            ---

            ### 📦 다운로드 안내
            - **Windows**: `CoreFlow_Setup.exe` (간편 설치 관리자) 또는 `CoreFlow.exe` (포터블 실행 파일)
            - **macOS**: `CoreFlow-macOS-universal.zip` 다운로드 후 압축 해제 ➔ `CoreFlow.app`을 `/Applications` 폴더로 이동하여 실행 (이후 업데이트는 앱 내에서 원클릭으로 자동 진행됩니다)
          draft: false
          prerelease: false
