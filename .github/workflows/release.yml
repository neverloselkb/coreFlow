name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CoreFlow Main Binary
        run: cargo build --release --bin CoreFlow

      - name: Build CoreFlow Setup Installer
        run: cargo build --release --bin CoreFlow_Setup

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            target/release/CoreFlow.exe
            target/release/CoreFlow_Setup.exe

  build-macos:
    name: Build macOS Universal App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Apple Silicon (Native)
        run: |
          if ! cargo build --release --bin CoreFlow 2> build_err.txt; then
            cat build_err.txt
            tail -n 30 build_err.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build Intel Mac (x86_64)
        run: |
          if ! cargo build --release --target x86_64-apple-darwin --bin CoreFlow 2> build_err_x86.txt; then
            cat build_err_x86.txt
            tail -n 30 build_err_x86.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Assemble Universal Binary & macOS App Bundle
        run: |
          mkdir -p CoreFlow.app/Contents/MacOS
          mkdir -p CoreFlow.app/Contents/Resources
          lipo -create \
            target/release/CoreFlow \
            target/x86_64-apple-darwin/release/CoreFlow \
            -output CoreFlow.app/Contents/MacOS/CoreFlow
          chmod +x CoreFlow.app/Contents/MacOS/CoreFlow

          VERSION_TAG=${GITHUB_REF_NAME#v}
          cat << EOF > CoreFlow.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CoreFlow</string>
              <key>CFBundleIdentifier</key>
              <string>com.coreflow.app</string>
              <key>CFBundleName</key>
              <string>CoreFlow</string>
              <key>CFBundleDisplayName</key>
              <string>CoreFlow</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION_TAG}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION_TAG}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          zip -r CoreFlow-macOS-universal.zip CoreFlow.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: CoreFlow-macOS-universal.zip

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/CoreFlow.exe
            release-assets/CoreFlow_Setup.exe
            release-assets/CoreFlow-macOS-universal.zip
          tag_name: ${{ github.ref_name }}
          name: CoreFlow ${{ github.ref_name }} — macOS 원클릭 인앱 자동 업데이트 지원 및 멀티플랫폼 공식 릴리스
          body: |
            ## 🚀 CoreFlow ${{ github.ref_name }} 릴리스 노트

            CoreFlow ${{ github.ref_name }}는 **macOS 환경에서의 원클릭 인앱 자동 업데이트(Self-Update) 엔진**을 공식 지원하며, 윈도우와 맥 전 플랫폼에서 끊김 없는 무인 업데이트 경험을 제공합니다.

            ---

            ### 🍎 macOS 원클릭 인앱 자동 업데이트 엔진 탑재
            - **인앱 원클릭 무인 업데이트**: 상단 업데이트 알림 바에서 버튼 클릭 한 번으로 최신 패키지 다운로드부터 앱 번들(`/Applications/CoreFlow.app`) 교체, 자동 재시작까지 전 과정 자동화
            - **Gatekeeper 격리 속성(Quarantine) 자동 해제**: 웹에서 다운로드된 새 버전에 붙는 보안 차단 속성을 자동 해제하여, 업데이트 직후 추가 경고창 없이 매끄럽게 재실행
            - **플랫폼별 최적 자산 자동 매칭**: macOS 환경 감지 시 `CoreFlow-macOS-universal.zip`을 정확히 탐색하여 다운로드 진행

            ---

            ### 🪟 Windows & macOS 공통 개선 사항
            - **업데이트 UI/UX 통일**: 플랫폼 구분 없이 직관적인 진행 상황 토스트 및 안내 메시지 제공
            - **안전한 데이터 보존**: 업데이트 프로세스 전환 시 게임 세션 및 사용자 설정 자동 저장 보장

            ---

            ### 📦 다운로드 안내
            - **Windows**: `CoreFlow_Setup.exe` (간편 설치 관리자) 또는 `CoreFlow.exe` (포터블 실행 파일)
            - **macOS**: `CoreFlow-macOS-universal.zip` 다운로드 후 압축 해제 ➔ `CoreFlow.app`을 `/Applications` 폴더로 이동하여 실행 (이후 업데이트는 앱 내에서 원클릭으로 자동 진행됩니다)
          draft: false
          prerelease: false
