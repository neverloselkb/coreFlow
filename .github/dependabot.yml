version: 2
updates:
  # Rust (Cargo) 크레이트 의존성 보안 및 버전 점검
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions 워크플로우 액션 버전 점검
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
